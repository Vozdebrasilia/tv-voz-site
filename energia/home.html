<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
<title>VOZ NEWS ENERGIA | Petróleo, Eletricidade e Transição Energética</title>
<meta name="description" content="VOZ NEWS ENERGIA: petróleo, gás, hidrelétricas, transmissão, eficiência energética, transição energética, política, negócios e entrevistas.">
<link rel="canonical" href="https://www.voznewsbrasil.com.br/energia/">
<link rel="icon" href="/favicon-voznews.png">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#04101c;color:#fff;font-family:Arial,Helvetica,sans-serif}.top-brand{background:#03111d;border-bottom:1px solid rgba(212,175,55,.3);min-height:170px;display:flex;align-items:center}.top-brand-inner{width:min(1220px,92%);margin:auto}.top-brand img{display:block;width:320px;max-width:56vw;height:auto}.energy-cover{position:relative;min-height:760px;display:flex;align-items:flex-end;overflow:hidden;background:linear-gradient(90deg,rgba(3,11,22,.87) 0%,rgba(3,11,22,.58) 38%,rgba(3,11,22,.08) 72%),linear-gradient(0deg,rgba(3,11,22,.88) 0%,rgba(3,11,22,.04) 55%),url('https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=2200&q=92') center/cover no-repeat}.energy-cover:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 28%,rgba(255,190,45,.30),transparent 24%),linear-gradient(115deg,transparent 50%,rgba(212,175,55,.13) 75%,transparent 90%);pointer-events:none}.cover-inner{position:relative;z-index:2;width:min(1220px,92%);margin:auto;padding:82px 0 62px}.cover-kicker{color:#f0c441;font-size:15px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.cover-title{font-size:clamp(64px,11vw,132px);line-height:.82;margin:14px 0 24px;letter-spacing:-5px;text-shadow:0 10px 35px rgba(0,0,0,.58)}.cover-title span{display:block;color:#e0b735}.cover-lead{max-width:820px;margin:0;color:#fff;font-size:clamp(20px,2.3vw,30px);line-height:1.38;text-shadow:0 3px 16px rgba(0,0,0,.82)}.cover-badge{display:inline-flex;margin-top:26px;padding:13px 19px;border:1px solid rgba(224,183,53,.78);border-radius:999px;background:rgba(3,11,22,.70);font-size:13px;font-weight:900;letter-spacing:1.1px}.cover-arrow{margin-top:36px;font-size:30px;color:#f0c441}.loading{padding:50px;text-align:center;color:#c7d6e6}@media(max-width:600px){.top-brand{min-height:205px}.top-brand img{width:320px;max-width:92vw}.energy-cover{min-height:690px;background-position:58% center}.cover-inner{padding:62px 0 42px}.cover-title{font-size:clamp(58px,17vw,94px);letter-spacing:-3px}.cover-lead{font-size:19px}.cover-badge{border-radius:18px;line-height:1.35}}
</style>
</head>
<body>
<header class="top-brand"><div class="top-brand-inner"><a href="https://www.voznewsbrasil.com.br/"><img src="/logo-voznews-oficial.png" alt="VOZNEWS VISIBILIDADE"></a></div></header>
<section class="energy-cover" aria-label="Capa VOZ NEWS ENERGIA">
  <div class="cover-inner">
    <div class="cover-kicker">TV VOZ • PORTAL ESPECIALIZADO</div>
    <h1 class="cover-title">VOZ NEWS <span>ENERGIA</span></h1>
    <p class="cover-lead">Petróleo, gás, hidrelétricas, redes, inovação, eficiência e transição energética. Informação para quem decide o futuro da energia no Brasil.</p>
    <div class="cover-badge">PETRÓLEO • ELETRICIDADE • RENOVÁVEIS • TECNOLOGIA</div>
    <div class="cover-arrow">↓</div>
  </div>
</section>
<div id="resto" class="loading">Carregando conteúdo...</div>
<script>
(async function(){
  try{
    const html=await fetch('/energia/index.html?v=base').then(r=>r.text());
    const doc=new DOMParser().parseFromString(html,'text/html');
    const originalStyle=doc.querySelector('style');
    if(originalStyle){const s=document.createElement('style');s.textContent=originalStyle.textContent;document.head.appendChild(s)}
    const main=doc.querySelector('main');
    const start=doc.querySelector('#petrobras');
    const host=document.getElementById('resto');
    host.className='';host.innerHTML='';
    if(main&&start){let n=start;while(n){host.appendChild(n.cloneNode(true));n=n.nextElementSibling}}
    const footer=doc.querySelector('footer');if(footer)host.appendChild(footer.cloneNode(true));
    var frames=['hq1.jpg','hq2.jpg','hq3.jpg','hqdefault.jpg'];
    document.querySelectorAll('.video-preview[data-youtube]').forEach(function(box,index){var id=box.dataset.youtube,img=box.querySelector('img'),step=index%frames.length;if(!img)return;setInterval(function(){step=(step+1)%frames.length;img.src='https://img.youtube.com/vi/'+id+'/'+frames[step]},1250)});
  }catch(e){document.getElementById('resto').textContent='Conteúdo temporariamente indisponível.'}
})();
</script>
</body>
</html>
