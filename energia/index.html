<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#04101c;color:#fff;font-family:Arial,Helvetica,sans-serif}.top-logo{background:#061421;border-bottom:1px solid rgba(212,175,55,.35);min-height:205px;display:flex;align-items:center}.top-logo .inner{width:min(1220px,92%);margin:auto}.top-logo img{display:block;width:320px;max-width:78vw}.energy-art{background:#020b14;border-bottom:1px solid rgba(212,175,55,.25)}.energy-art .inner{width:min(1220px,100%);margin:auto}.energy-art img{display:block;width:100%;height:auto}.metrics{background:#061421;border-bottom:1px solid rgba(212,175,55,.25)}.metrics .inner{width:min(1220px,92%);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:22px 0}.metric{padding:18px 20px;border:1px solid rgba(212,175,55,.28);border-radius:16px;background:linear-gradient(135deg,rgba(212,175,55,.13),rgba(51,149,214,.07))}.metric strong{display:block;font-size:30px;line-height:1;color:#fff}.metric small{display:block;margin-top:7px;color:#c7d6e6;font-size:13px;line-height:1.35}.loading{padding:50px;text-align:center;color:#c7d6e6}@media(max-width:800px){.metrics .inner{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top-logo{min-height:205px}.top-logo img{width:320px}.energy-art .inner{width:100%}.metrics .inner{grid-template-columns:1fr 1fr;gap:10px;padding:16px 0}.metric{padding:15px}.metric strong{font-size:25px}}
</style>
</head>
<body>
<header class="top-logo"><div class="inner"><a href="https://www.voznewsbrasil.com.br/"><img src="/logo-voznews-oficial.png" alt="VOZNEWS VISIBILIDADE"></a></div></header>
<section class="energy-art" aria-label="Capa VOZ NEWS ENERGIA"><div class="inner"><img src="/energia/voznews-energia-capa.jpg?v=20260819-1820" alt="VOZ NEWS ENERGIA — petróleo, geração, transmissão, renováveis e mercado"></div></section>
<section class="metrics" aria-label="Números VozNews"><div class="inner"><div class="metric"><strong>215 mil+</strong><small>seguidores no Instagram</small></div><div class="metric"><strong>200 milhões+</strong><small>interações por mês no Instagram</small></div><div class="metric"><strong>1.000+</strong><small>entrevistas no acervo</small></div><div class="metric"><strong>10 mil+</strong><small>horas de transmissão e conteúdo</small></div></div></section>
<div id="resto" class="loading">Carregando conteúdo...</div>
<script>
(async function(){
  try{
    const html=await fetch('/energia/content.html?v=20260819-1820').then(r=>r.text());
    const doc=new DOMParser().parseFromString(html,'text/html');
    const originalStyle=doc.querySelector('style');
    if(originalStyle){const s=document.createElement('style');s.textContent=originalStyle.textContent;document.head.appendChild(s)}
    const start=doc.querySelector('#petrobras');
    const host=document.getElementById('resto');
    host.className='';host.innerHTML='';
    if(start){let n=start;while(n){host.appendChild(n.cloneNode(true));n=n.nextElementSibling}}
    const footer=doc.querySelector('footer');if(footer)host.appendChild(footer.cloneNode(true));
    var frames=['hq1.jpg','hq2.jpg','hq3.jpg','hqdefault.jpg'];
    document.querySelectorAll('.video-preview[data-youtube]').forEach(function(box,index){var id=box.dataset.youtube,img=box.querySelector('img'),step=index%frames.length;if(!img)return;setInterval(function(){step=(step+1)%frames.length;img.src='https://img.youtube.com/vi/'+id+'/'+frames[step]},1250)});
  }catch(e){document.getElementById('resto').textContent='Conteúdo temporariamente indisponível.'}
})();
</script>
</body>
</html>
