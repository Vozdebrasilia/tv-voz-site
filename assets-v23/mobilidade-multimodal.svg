<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Mobilidade premium com automóvel, motocicleta, embarcação e aeronave">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061421"/><stop offset=".46" stop-color="#0a3155"/><stop offset="1" stop-color="#07101b"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#164f82"/><stop offset="1" stop-color="#07182a"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2834"/><stop offset="1" stop-color="#05090e"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b6fa1"/><stop offset="1" stop-color="#073b64"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff2a6"/><stop offset=".38" stop-color="#d4af37"/><stop offset="1" stop-color="#8e6914"/></linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6fb"/><stop offset=".35" stop-color="#8998aa"/><stop offset="1" stop-color="#222c38"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".6"/></filter>
</defs>
<rect width="1200" height="675" rx="34" fill="url(#bg)"/>
