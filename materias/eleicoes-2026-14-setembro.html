66b}.article img{width:100%;max-height:720px;object-fit:cover;border-radius:18px;margin:16px 0}.article p{font-size:18px;line-height:1.68}.method{background:#eef4f8;padding:18px;border-radius:14px}.analysis{border-left:5px solid var(--g);background:#fff8da;padding:20px;margin:20px 0}.analysis strong{display:block;margin-bottom:8px}.source{border-top:1px solid #ddd;padding-top:14px;margin-top:24px;font-size:12px;color:#68737d}.source a{color:#395b77}.by{font-weight:900;color:#234d72}.note{font-size:13px;color:#6d7780}.back{display:inline-block;color:#0b3156;font-weight:900;text-decoration:none;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.article{border-radius:0;padding:24px 18px}.hero{padding:24px 18px}.top img{width:155px}}</style></head><body><header class="top"><a href="/"><img src="/logo-voznews-oficial.png" alt="VOZ NEWS"></a><a href="/">TV Voz de Brasília</a></header><section class="hero"><span class="badge">ELEIÇÕES 2026 • EDIÇÃO DE 14/09</span><h1>15 notícias para acompanhar a reta final eleitoral</h1><p>Presidência, Senado, Distrito Federal e cenários estaduais com números, metodologia, margem de erro e contexto. Atualizado em 14 de setembro de 2026.</p></section><main><section class="grid" id="cards"></section><section id="articles"></section></main><script>const D=[
{id:'datafolha-presidencia',t:'Datafolha: Lula tem 39% e Flávio 35%; segundo turno fica em empate técnico',l:'Levantamento nacional divulgado na reta final mostra quatro pontos no primeiro turno e dois no confronto direto.',n:'Lula 39% • Flávio 35%',x:'No cenário nacional de primeiro turno, Lula (PT) aparece com 39% e Flávio Bolsonaro (PL) com 35%. Augusto Cury tem 6%, Ronaldo Caiado 4%, Renan Santos 3% e Romeu Zema 2%. Em eventual segundo turno, Lula registra 46% e Flávio 44%, diferença dentro da margem de erro.',m:'Datafolha ouviu 2.002 eleitores em 125 municípios entre 8 e 10 de setembro, presencialmente. Margem de erro de 2 pontos percentuais e confiança de 95%.',a:'O dado mais importante é a competitividade do segundo turno. A fotografia não autoriza prever vencedor: numa disputa tão próxima, rejeição, comparecimento e movimentação dos últimos dias podem ser decisivos.',s:'Folha de S.Paulo / Datafolha',u:'https://www1.folha.uol.com.br/poder/2026/09/datafolha-lula-tem-39-e-flavio-bolsonaro-35-em-primeiro-turno.shtml',i:'https://jpimg.com.br/uploads/2025/08/enq20250826001-1-676x450.jpg',c:'Foto relacionada: Luiz Inácio Lula da Silva em atividade pública.'},
{id:'espontanea-datafolha',t:'Voto espontâneo: Lula marca 33%, Flávio 25% e Jair Bolsonaro ainda é citado por 2%',l:'Datafolha mede a lembrança dos nomes sem apresentar lista de candidatos.',n:'Lula 33% • Flávio 25% • Jair 2%',x:'Na pergunta espontânea, em que o entrevistador não apresenta nomes, Lula foi citado por 33% e Flávio Bolsonaro por 25%. O ex-presidente Jair Bolsonaro, que não disputa o pleito, ainda foi lembrado por 2% dos entrevistados. Augusto Cury foi citado por 3%, Renan Santos por 2% e Ronaldo Caiado por 1%.',m:'A rodada nacional ouviu cerca de 2 mil eleitores em 125 cidades entre 8 e 10 de setembro. A espontânea mede lembrança eleitoral e não deve ser comparada mecanicamente com a estimulada.',a:'Oito pontos entre Lula e Flávio na espontânea sugerem diferença de consolidação de voto, mas a mesma rodada mostra distância menor quando todos os nomes são apresentados. São perguntas distintas e devem ser lidas separadamente.',s:'Folha de S.Paulo / Datafolha',u:'https://www1.folha.uol.com.br/colunas/painel/2026/09/jair-bolsonaro-ainda-e-citado-por-2-dos-eleitores-segundo-datafolha.shtml',i:'https://quemfoiquem.org.br/assets/images/users/senador5894.jpg',c:'Foto relacionada: Flávio Bolsonaro.'},
{id:'quaest-segundo-turno',t:'Quaest: Lula e Flávio aparecem em 41% a 41% no segundo turno',l:'Pesquisa reforça cenário nacional apertado e mostra diferença entre primeiro e segundo turnos.',n:'2º turno: 41% a 41%',x:'A Quaest divulgada em 7 de setembro registrou empate numérico de 41% a 41% entre Lula e Flávio Bolsonaro em eventual segundo turno. No primeiro turno, Lula tinha 36%, Flávio 29% e Augusto Cury 8%.',m:'Margem de erro de 2 pontos percentuais. Pesquisa registrada na Justiça Eleitoral sob BR-01720/2026. As datas e o método de coleta devem ser considerados antes de comparar o resultado com outros institutos.',a:'A convergência de diferentes levantamentos para uma disputa apertada é mais relevante do que pequenas diferenças pontuais entre percentuais. O acompanhamento de várias rodadas reduz o risco de supervalorizar uma oscilação isolada.',s:'Folha de S.Paulo / Quaest',u:'https://www1.folha.uol.com.br/poder/2026/09/quaest-lula-e-flavio-bolsonaro-empatam-numericamente-em-cenario-de-2o-turno.shtml',i:'https://www.justicaeleitoral.jus.br/imagens/fotos/tre-mt-tse-realiza-audiencias-publicas-sobre-normas-das-eleicoes-gerais-de-2026/%40%40streaming/image/padrao%20de%20imagem%20do%20site%20do%20tre-mt%20-%202026-01-06T102823.578.jpg',c:'Imagem da Justiça Eleitoral: urna das Eleições 2026.'},
{id:'atlas-presidencia',t:'AtlasIntel/Bloomberg: Lula tem 43% e Flávio 37,4% no primeiro turno',l:'Levantamento digital tem amostra maior e margem de erro declarada de um ponto.',n:'Lula 43% • Flávio 37,4%',x:'A rodada AtlasIntel/Bloomberg divulgada em 10 de setembro apontou Lula com 43% e Flávio Bolsonaro com 37,4% no primeiro turno. Nas simulações de segundo turno, os principais confrontos ficaram dentro da margem de erro informada pelo instituto.',m:'Foram ouvidos 5.000 eleitores entre 4 e 9 de setembro por recrutamento digital aleatório. Margem de erro de 1 ponto percentual e confiança de 95%. Registro BR-01452/2026.',a:'O Atlas usa método diferente do Datafolha e da Quaest. A comparação responsável deve observar método, período de campo e composição da amostra — não apenas o número final.',s:'UOL / AtlasIntel-Bloomberg',u:'https://noticias.uol.com.br/eleicoes/2026/09/10/pesquisa-presidencial-atlas-hoje-veja-numeros-do-levantamento.ghtm',i:'https://jpimg.com.br/uploads/2025/09/flavio-bolsonaro-1.jpg',c:'Foto relacionada: Flávio Bolsonaro em ato político.'},
{id:'como-comparar-pesquisas',t:'Datafolha, Quaest e Atlas: por que pesquisas diferentes podem mostrar números diferentes',l:'Método, data de campo, amostra e forma de pergunta precisam acompanhar qualquer comparação.',n:'Metodologia importa',x:'Datafolha, Quaest e AtlasIntel registram uma disputa presidencial competitiva, mas chegam a percentuais diferentes. Isso não significa, por si só, que um levantamento esteja certo e outro errado. Cada estudo trabalha com desenho amostral, forma de coleta, datas e ponderações próprias.',m:'O TSE exige o registro prévio de pesquisas eleitorais e a divulgação de informações como contratante, metodologia, período de realização, plano amostral, intervalo de confiança e margem de erro. A Justiça Eleitoral informa que não faz controle prévio do resultado.',a:'A melhor leitura é observar séries, não uma única manchete. Quando vários institutos apontam a mesma direção ao longo do tempo, há evidência mais robusta de tendência; quando divergem, o correto é explicitar as diferenças metodológicas.',s:'Tribunal Superior Eleitoral — PesqEle',u:'https://www.tse.jus.br/eleicoes/pesquisas-eleitorais',i:'https://midias.agazeta.com.br/2024/08/06/tela-do-site-do-tse-com-reproducao-de-consulta-sobre-pesquisa-eleitoral-de-vitoria-registrada-na-justica-2376090-article.png',c:'Imagem contextual: tela de consulta pública do sistema de pesquisas eleitorais.'},
{id:'df-senado-datafolha',t:'Senado no DF: Michelle 21%, Leila 18%, Bia 15% e Erika 14% no Datafolha',l:'Com duas vagas em disputa, quatro candidaturas aparecem próximas na pesquisa estimulada.',n:'Michelle 21% • Leila 18% • Bia 15% • Erika 14%',x:'Michelle Bolsonaro aparece com 21%, Leila do Vôlei com 18%, Bia Kicis com 15% e Erika Kokay com 14%. Pela margem de erro de três pontos, há sobreposição entre as principais candidaturas.',m:'Datafolha ouviu 910 eleitores entre 8 e 11 de setembro. Margem de erro de 3 pontos e confiança de 95%. O cenário considera as duas escolhas para o Senado e normaliza os resultados para 100%.',a:'A disputa pela segunda cadeira está especialmente aberta. Como cada eleitor pode votar em dois nomes, a segunda escolha e o nível ainda elevado de indecisão podem alterar a ordem final.',s:'Folha de S.Paulo / Datafolha',u:'https://www1.folha.uol.com.br/poder/2026/09/datafolha-michelle-bolsonaro-e-leila-do-volei-lideram-disputa-ao-senado-pelo-df.shtml',i:'https://cdn.oantagonista.com/uploads/2026/06/55267927495_2c06b09cf5_k.jpg',c:'Foto relacionada: Michelle Bolsonaro em evento político.'},
{id:'df-senado-institutos',t:'DF: Datafolha, Quaest e RealTime convergem na liderança de Michelle, mas diferem no pelotão seguinte',l:'Comparação mostra como datas e métodos alteram os percentuais da corrida ao Senado.',n:'Três institutos, uma disputa aberta',x:'No Datafolha, Michelle tem 21%, Leila 18%, Bia 15% e Erika 14%. Na Quaest, Michelle registrou 26%, Leila 17%, Erika 13% e Bia 11%. No RealTime Big Data, Michelle marcou 26%, Leila e Bia 17% e Erika 15%.',m:'Datafolha: 910 entrevistas, margem 3 p.p.; Quaest: 1.104 entrevistas, margem 3 p.p., registro DF-01987/2026; RealTime: 1.600 entrevistas por telefone e internet, margem 2 p.p., registro DF-09600/2026.',a:'A liderança de Michelle aparece nos três levantamentos, mas a ordem das candidatas seguintes varia. Isso recomenda cautela ao transformar pequenas diferenças em “posição consolidada”.',s:'Datafolha, Quaest e RealTime Big Data',u:'https://noticias.uol.com.br/eleicoes/2026/09/09/realtime-big-data-michelle-bolsonaro-lidera-para-o-senado-no-df.ghtm',i:'https://www12.senado.leg.br/noticias/materias/2023/04/24/projeto-da-lei-geral-do-esporte-volta-a-pauta-do-plenario-nesta-quarta/20210805_03531mo.jpg/mural/imagem_materia',c:'Foto relacionada: senadora Leila Barros no plenário.'},
{id:'df-governo-quaest',t:'Quaest: Celina Leão lidera Governo do DF com 35%; Arruda tem 18% e Grass 17%',l:'Governadora mantém vantagem numérica; segundo grupo está tecnicamente próximo.',n:'Celina 35% • Arruda 18% • Grass 17%',x:'Celina Leão aparece com 35% das intenções de voto para o Governo do Distrito Federal. José Roberto Arruda tem 18% e Leandro Grass 17%, diferença de um ponto entre eles.',m:'Quaest ouviu 1.104 eleitores entre 4 e 7 de setembro. Margem de erro de 3 pontos percentuais. A situação jurídica de candidaturas deve ser acompanhada separadamente nas decisões da Justiça Eleitoral.',a:'Celina mantém uma vantagem expressiva na fotografia atual. A disputa pelo segundo lugar, porém, permanece sensível a oscilações dentro da margem de erro e a fatos jurídicos e políticos da reta final.',s:'Folha de S.Paulo / Quaest',u:'https://www1.folha.uol.com.br/poder/2026/09/quaest-celina-lidera-no-1o-turno-no-df-com-35-contra-18-de-arruda-e-17-de-grass.shtml',i:'https://cdn.jornaldebrasilia.com.br/wp-content/uploads/2025/05/16120932/celina-leao.jpg',c:'Foto relacionada: Celina Leão em entrevista à imprensa.'},
{id:'df-presidencia',t:'No DF, Datafolha aponta Flávio com 51% e Lula com 39% em eventual segundo turno',l:'Distrito Federal aparece mais favorável ao candidato do PL do que o resultado nacional.',n:'Flávio 51% • Lula 39%',x:'Em eventual segundo turno presidencial no Distrito Federal, Flávio Bolsonaro registra 51% e Lula 39% no Datafolha. O resultado contrasta com a rodada nacional, em que o confronto aparece em empate técnico.',m:'O recorte do DF ouviu 910 eleitores e tem margem de erro de 3 pontos percentuais. Pesquisas estaduais não devem ser extrapoladas para o resultado nacional.',a:'O DF é um território eleitoral específico e historicamente competitivo para a direita. O dado ajuda a entender a geografia do voto, especialmente quando cruzado com a disputa local pelo Senado e pelo governo.',s:'Folha de S.Paulo / Datafolha',u:'https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml',i:'https://cdn.crusoe.com.br/uploads/2022/02/Flavio-Bolsonaro_Adriano-Machado-18-1024x683.jpg',c:'Foto relacionada: Flávio Bolsonaro em Brasília.'},
{id:'pe-senado',t:'Pernambuco: Marília Arraes tem 18% e Humberto Costa 16% para o Senado',l:'Datafolha mostra empate técnico na liderança das duas vagas pernambucanas.',n:'Marília 18% • Humberto 16% • Mendonça 12%',x:'Marília Arraes aparece com 18%, Humberto Costa com 16%, Mendonça Filho com 12%, Eduardo da Fonte com 10% e Túlio Gadêlha com 5%.',m:'Datafolha ouviu 1.204 eleitores entre 8 e 10 de setembro. Margem de erro de 3 pontos percentuais. Registros PE-04411/2026 e BR-05923/2026. Na espontânea, 58% disseram não saber em quem votar.',a:'O alto índice de indefinição espontânea indica que as duas cadeiras ainda comportam movimentação relevante. A diferença de dois pontos entre os líderes está dentro da margem de erro.',s:'Folha de S.Paulo / Datafolha',u:'https://www1.folha.uol.com.br/poder/2026/09/datafolha-senado-em-pernambuco-tem-marilia-com-18-humberto-16-mendonca-12-eduardo-10.shtml',i:'https://imagens.ne10.uol.com.br/veiculos/_midias/jpg/2026/03/20/whatsapp_image_2026_03_20_at_15_44_49-36559131.jpeg?ims=800x533',c:'Foto relacionada: Marília Arraes em atividade política.'},
{id:'mg-senado',t:'Minas: Marília Campos tem 12%; Aécio e Carlos Viana, 10%, em disputa aberta pelo Senado',l:'Datafolha registra empate técnico entre os principais nomes para as duas vagas.',n:'Marília 12% • Aécio 10% • Viana 10%',x:'Marília Campos registra 12%, Aécio Neves e Carlos Viana aparecem com 10% cada, Domingos Sávio tem 8% e Marcelo Aro 6%. Considerando a margem de erro, os quatro primeiros estão tecnicamente próximos.',m:'Datafolha ouviu 1.204 eleitores entre 8 e 10 de setembro. Margem de erro de 3 pontos percentuais. Registro MG-01611/2026. Indecisos são 20% e brancos/nulos 18%.',a:'Com duas vagas e elevada indefinição, Minas apresenta uma das disputas senatoriais mais abertas. A leitura correta é de bloco competitivo, não de liderança consolidada.',s:'Agência Estado / Terra — Datafolha',u:'https://www.terra.com.br/noticias/brasil/politica/datafolhamg-marilia-tem-12-para-o-senado-carlos-viana-e-aecio-10%2C2b86a9d48b891d9bc4a9489bd36bcdb9o1jwa85l.html',i:'https://otempo.scene7.com/is/image/sempreeditora/elei%C3%A7%C3%B5es%202026%20-%20senadores-marilia_campos-contagem-prefeitura_de_contagem-1774799228?dpr=off&qlt=90&ts=1774799664263',c:'Foto relacionada: Marília Campos em evento político em Minas Gerais.'},
{id:'rj-senado',t:'Rio: Benedita lidera; diferenças entre institutos mostram por que método deve acompanhar o percentual',l:'Quaest e Paraná colocaram Benedita à frente, mas com escalas numéricas diferentes.',n:'Benedita lidera nos levantamentos',x:'Na Quaest de 8 de setembro, Benedita da Silva registrou 15%, Crivella 8% e Jordy, Pedro Paulo e Portinho 6%. No Paraná Pesquisas, Benedita apareceu com 30,7%, Crivella 20,5% e Pedro Paulo 17,8%.',m:'Quaest: 1.302 entrevistas presenciais entre 4 e 7 de setembro, margem de 3 p.p., registro RJ-04768/2026. Paraná: 1.600 entrevistas em 57 municípios entre 5 e 7 de setembro, margem de 2,5 p.p. No Senado, formatos de pergunta e tratamento dos dois votos influenciam a escala dos percentuais.',a:'Os dois institutos apontam Benedita numericamente na frente, mas a diferença de escala é um alerta: comparar números sem explicar a pergunta e a forma de contabilização pode induzir o leitor ao erro.',s:'UOL / Quaest e Paraná Pesquisas',u:'https://noticias.uol.com.br/eleicoes/2026/09/09/pesquisa-senado-rj-veja-quem-lidera-levantamento-mais-recente.ghtm',i:'https://cdn.oantagonista.com/uploads/2026/08/img20260415144548932-1168x720.jpg',c:'Foto relacionada: Benedita da Silva em atividade parlamentar.'},
{id:'sp-senado',t:'São Paulo: Marina e Tebet têm 13%; André do Prado 11% e Derrite 10% no Datafolha',l:'Quatro nomes aparecem tecnicamente próximos na disputa por duas vagas.',n:'Marina 13% • Tebet 13% • Prado 11% • Derrite 10%',x:'Marina Silva e Simone Tebet registram 13% cada, André do Prado 11% e Guilherme Derrite 10%. Ricardo Salles aparece com 5%.',m:'Datafolha entrevistou 1.610 eleitores em 65 cidades entre 8 e 10 de setembro. Margem de erro de 2 pontos percentuais e confiança de 95%.',a:'A disputa paulista permanece fragmentada e com duas cadeiras em jogo. A proximidade do primeiro pelotão recomenda evitar manchetes que tratem pequenas diferenças como posições definitivas.',s:'Folha de S.Paulo / Datafolha',u:'https://www1.folha.uol.com.br/poder/2026/09/datafolha-marina-tebet-andre-do-prado-e-derrite-empatam-na-disputa-pelo-senado-em-sp.shtml',i:'https://static.poder360.com.br/2026/05/MarinaSilva-PlanoClima-11-scaled-1-848x477.jpg',c:'Foto relacionada: Marina Silva, candidata ao Senado por São Paulo.'},
{id:'sp-governo',t:'SP: Quaest dá 42% a Tarcísio; Paraná registra 49,7% — veja por que os números não são contraditórios',l:'Levantamentos têm períodos e amostras diferentes, embora ambos apontem vantagem do governador.',n:'Quaest 42% • Paraná 49,7%',x:'A Quaest divulgada em 8 de setembro apontou Tarcísio de Freitas com 42% e Fernando Haddad com 27%. O Paraná Pesquisas, divulgado em 11 de setembro, registrou Tarcísio com 49,7% e Haddad com 34,5% dos votos totais.',m:'Quaest: 1.800 entrevistas entre 4 e 7 de setembro, margem de 2 p.p., registro SP-00959/2026. Paraná: 1.680 eleitores em 77 municípios entre 7 e 10 de setembro, margem de 2,4 p.p. Datas e desenhos amostrais são diferentes.',a:'Os percentuais não devem ser subtraídos como se viessem da mesma pesquisa. O ponto de convergência é a vantagem de Tarcísio; a magnitude dessa vantagem varia conforme o levantamento.',s:'Folha de S.Paulo / Quaest e Paraná Pesquisas',u:'https://www1.folha.uol.com.br/colunas/painel/2026/09/tarcisio-chega-a-56-dos-votos-validos-e-venceria-em-primeiro-turno-diz-pesquisa-parana.shtml',i:'https://pbs.twimg.com/media/Fw_1YbtXgAA6eb_?format=jpg&name=large',c:'Foto relacionada: Tarcísio de Freitas em ato oficial do Governo de São Paulo.'},
{id:'lula-live-campanha',t:'Lula pede mobilização de militantes na reta final e concentra discurso em economia e campanha',l:'Presidente realizou transmissão com apoiadores neste domingo, a três semanas do primeiro turno.',n:'Fato político do dia',x:'Em transmissão realizada no domingo, 13 de setembro, Lula pediu que apoiadores intensifiquem a mobilização e o combate à desinformação. O presidente destacou temas econômicos, educação e segurança pública e elevou o tom contra adversários na campanha.',m:'As falas de campanha são declarações políticas e devem ser diferenciadas de dados objetivos. Acusações feitas por candidatos contra adversários não são reproduzidas aqui como fatos sem comprovação independente.',a:'Com pesquisas mostrando segundo turno apertado, a estratégia de mobilização da base ganha peso. Nesta fase, o desafio dos candidatos é ampliar apoio sem transformar acusações de campanha em informação factual.',s:'Folha de S.Paulo — cobertura de 14/09/2026',u:'https://www1.folha.uol.com.br/poder/2026/09/lula-pede-em-live-que-militancia-dissemine-verdade-contra-negacionistas-e-ignora-crise-no-stf.shtml',i:'https://uploads.bpmoney.com.br/2026/08/17868921756a81cf8ff2a0a_1786892175_3x2_rt.jpg',c:'Foto relacionada: Lula em ato de campanha em 2026.'}
