<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eleições 2026: 15 notícias e análises de 13 de setembro | VOZ NEWS</title><meta name="description" content="15 pautas verificadas sobre Eleições 2026, pesquisas, Presidência, Senado e Distrito Federal, com metodologia e análise de Paulo Fayad."><link rel="canonical" href="https://www.voznewsbrasil.com.br/materias/eleicoes-2026-13-setembro.html"><style>:root{--n:#061727;--b:#0b3156;--g:#d4af37;--p:#fff;--i:#172738;--m:#647281}*{box-sizing:border-box}body{margin:0;background:#071827;color:var(--i);font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:9;background:#061c3f;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--g)}.top img{width:210px}.top a{color:#fff;text-decoration:none;font-weight:900}.hero{max-width:1120px;margin:28px auto 18px;padding:34px;color:#fff}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1;margin:10px 0}.hero p{font-size:20px;color:#dbe7f3;max-width:900px}.badge{display:inline-block;background:var(--g);color:#08192b;padding:8px 13px;border-radius:999px;font-weight:900}.grid{max-width:1120px;margin:auto;padding:0 22px 50px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 14px 35px #0005}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#0b3156}.card div{padding:20px}.card h2{font-size:22px;line-height:1.1;margin:0 0 10px}.card p{color:#52616e;line-height:1.45}.card a{display:inline-block;margin-top:8px;background:#0b3156;color:#fff;padding:10px 14px;border-radius:999px;text-decoration:none;font-weight:800}.article{max-width:980px;margin:0 auto 36px;background:#fff;padding:38px;border-radius:24px;scroll-margin-top:95px}.article h2{font-size:clamp(32px,5vw,54px);line-height:1.05;margin:12px 0}.article .lead{font-size:21px;font-weight:700;color:#40566b}.article img{width:100%;max-height:720px;object-fit:cover;border-radius:18px;margin:16px 0}.article p{font-size:18px;line-height:1.68}.method{background:#eef4f8;padding:18px;border-radius:14px}.analysis{border-left:5px solid var(--g);background:#fff8da;padding:20px;margin:20px 0}.analysis strong{display:block;margin-bottom:8px}.source{border-top:1px solid #ddd;padding-top:14px;margin-top:24px;font-size:12px;color:#68737d}.source a{color:#395b77}.by{font-weight:900;color:#234d72}.note{font-size:13px;color:#6d7780}.back{display:inline-block;color:#0b3156;font-weight:900;text-decoration:none;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.article{border-radius:0;padding:24px 18px}.hero{padding:24px 18px}.top img{width:155px}}</style></head><body><header class="top"><a href="/"><img src="/logo-voznews-oficial.png" alt="VOZ NEWS"></a><a href="/">TV Voz de Brasília</a></header><section class="hero"><span class="badge">ELEIÇÕES 2026 • EDIÇÃO DE 13/09</span><h1>15 notícias para entender a corrida eleitoral hoje</h1><p>Presidência, Senado, Distrito Federal e cenários estaduais. Dados registrados, metodologia destacada e comparação responsável entre institutos.</p></section><main><section class="grid" id="cards"></section><section id="articles"></section></main><script>const D=[
['datafolha-nacional-lula-flavio','Datafolha: Lula tem 39% e Flávio 35%; segundo turno fica em empate técnico','Levantamento nacional coloca a disputa presidencial em quadro apertado, com 46% a 44% em eventual segundo turno.','Lula 39% • Flávio 35%','No cenário nacional de primeiro turno, Lula (PT) aparece com 39% e Flávio Bolsonaro (PL) com 35%. Em eventual segundo turno, Lula registra 46% e Flávio 44%, diferença dentro da margem de erro informada pelo instituto.','Datafolha; rodada divulgada em 12 de setembro. O recorte nacional citado está registrado na Justiça Eleitoral sob BR-03904/2026.','A estabilidade da polarização é o dado central. Quatro pontos separam os dois no primeiro turno e apenas dois no confronto direto. Isso não autoriza previsão de vencedor; indica uma reta final dependente de rejeição, comparecimento e eleitores ainda móveis.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml'],
['agregador-uol-lula-flavio','Agregador do UOL reduz diferença entre Lula e Flávio para 5 pontos','Média ponderada mostra Lula com 38,7% e Flávio Bolsonaro com 33,5% no primeiro turno.','Lula 38,7% • Flávio 33,5%','O agregador eleitoral do UOL, atualizado após a nova rodada do Datafolha, aponta Lula com 38,7% e Flávio Bolsonaro com 33,5%. Uma semana antes, a distância era de seis pontos; agora, é de cerca de cinco. No segundo turno agregado, Lula tem 44,8% e Flávio 43,8%.','O agregador combina pesquisas presidenciais registradas no TSE desde janeiro de 2026 e aplica metodologia própria de ponderação. Agregadores não substituem a leitura de cada pesquisa individual.','A utilidade de um agregador é reduzir o peso de oscilações isoladas. A aproximação merece atenção, mas só novas rodadas poderão mostrar se há tendência consistente.','UOL Eleições','https://noticias.uol.com.br/eleicoes/2026/09/12/agregador-de-pesquisas-diferenca-de-lula-e-flavio-cai-para-5-pontos.ghtm'],
['df-presidencia','No DF, Flávio Bolsonaro marca 51% e Lula 39% em eventual segundo turno','Datafolha mostra vantagem do candidato do PL entre eleitores do Distrito Federal.','Flávio 51% • Lula 39%','No Distrito Federal, o Datafolha aponta Flávio Bolsonaro (PL) com 51% e Lula (PT) com 39% em eventual segundo turno presidencial.','Datafolha ouviu 910 eleitores do DF entre 8 e 10 de setembro, presencialmente. Margem de erro de 3 pontos percentuais, confiança de 95%. Registros DF-06055/2026 e BR-03904/2026.','O DF aparece mais favorável à oposição do que a média nacional. Brasília é estratégica também porque o cenário presidencial se cruza com as disputas locais pelo Senado e pelo governo.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml'],
['df-senado-datafolha','Senado no DF: Michelle 21%, Leila 18%, Bia 15% e Erika 14% no Datafolha','Com duas vagas em disputa, os quatro primeiros nomes aparecem próximos e há sobreposição pela margem de erro.','Michelle 21% • Leila 18% • Bia 15% • Erika 14%','Michelle Bolsonaro (PL) aparece com 21%, Leila do Vôlei (PDT) com 18%, Bia Kicis (PL) com 15% e Erika Kokay (PT) com 14% na pesquisa estimulada do Datafolha para as duas vagas ao Senado pelo Distrito Federal.','910 entrevistas de 8 a 11 de setembro; margem de erro de 3 pontos; confiança de 95%. Registros DF-06055/2026 e BR-04623/2026.','A principal mensagem é que a disputa pela segunda cadeira permanece aberta. Em eleição com dois votos para o Senado, a dinâmica da segunda escolha pode alterar bastante a ordem final.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/datafolha-michelle-bolsonaro-e-leila-do-volei-lideram-disputa-ao-senado-pelo-df.shtml'],
['df-senado-comparacao','Datafolha, Quaest e RealTime: o que muda na corrida ao Senado pelo DF','Os três institutos colocam Michelle à frente, mas as magnitudes e a ordem dos nomes seguintes variam.','Michelle: 21% Datafolha • 26% Quaest • 26% RealTime','No Datafolha, Leila aparece com 18%, Bia com 15% e Erika com 14%. Na Quaest, Michelle tem 26%, Leila 17%, Erika 13% e Bia 11%. No RealTime Big Data, Michelle marca 26%, Leila e Bia 17% e Erika 15%.','Datafolha: 910 entrevistas, margem 3 p.p.; Quaest: 1.104, margem 3 p.p., DF-01987/2026; RealTime: 1.600 por telefone e internet, margem 2 p.p., DF-09600/2026.','Comparar institutos exige observar coleta, datas, amostra e pergunta. A convergência na liderança é informativa; as diferenças no pelotão seguinte mostram por que uma única pesquisa não deve ser tratada como resultado antecipado.','Folha/UOL — Datafolha, Quaest e RealTime Big Data','https://noticias.uol.com.br/eleicoes/2026/09/09/realtime-big-data-michelle-bolsonaro-lidera-para-o-senado-no-df.amp.htm'],
['df-governo-quaest','Quaest: Celina lidera governo do DF com 35%; Arruda tem 18% e Grass 17%','Pesquisa mostra a governadora à frente no primeiro turno.','Celina 35% • Arruda 18% • Grass 17%','A Quaest aponta Celina Leão (PP) com 35% das intenções de voto para o Governo do Distrito Federal. José Roberto Arruda aparece com 18% e Leandro Grass (PT), com 17%. No levantamento anterior do instituto, Celina tinha 34%.','Quaest ouviu 1.104 eleitores de 4 a 7 de setembro; margem de erro de 3 pontos. Registros BR-04442/2026 e DF-01987/2026.','Celina mantém vantagem numérica relevante, mas a campanha segue em curso. O desempenho do palanque local também influencia as disputas ao Senado e à Presidência.','Folha de S.Paulo / Quaest','https://www1.folha.uol.com.br/poder/2026/09/quaest-celina-lidera-no-1o-turno-no-df-com-35-contra-18-de-arruda-e-17-de-grass.shtml'],
['avaliacao-lula-estados','Avaliação de Lula varia de 46% positiva em PE a 25% em SP; no DF, 26%','Datafolha revela fortes diferenças regionais na percepção do governo.','PE 46% • MG 34% • DF 26% • SP 25%','A avaliação positiva do governo Lula é de 46% em Pernambuco, 34% em Minas Gerais, 27% no Rio de Janeiro, 26% no Distrito Federal e 25% em São Paulo. No DF, 51% classificam a gestão como ruim ou péssima.','Pesquisas presenciais entre 8 e 10 de setembro. Amostras: SP 1.610; MG 1.204; RJ 1.204; PE 1.204; DF 910. Margens de 2 p.p. em SP e 3 p.p. nos demais.','A eleição nacional é formada por mapas regionais muito diferentes. Reduzir perdas em estados de rejeição alta pode ser tão decisivo quanto ampliar vantagem em redutos fortes.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/avaliacao-positiva-de-lula-vai-de-46-no-pe-a-25-em-sp-mostra-datafolha.shtml'],
['sp-presidencia','São Paulo: Flávio 47% e Lula 42% em eventual segundo turno','No maior colégio eleitoral, candidato do PL abre cinco pontos no confronto direto; no primeiro turno, são 35% a 33%.','Flávio 47% • Lula 42%','Em São Paulo, o Datafolha aponta Flávio Bolsonaro com 47% e Lula com 42% em eventual segundo turno. No primeiro turno, Flávio marca 35% e Lula 33%, diferença dentro da margem de erro.','1.610 entrevistas presenciais entre 8 e 10 de setembro; margem de erro de 2 pontos e confiança de 95%. Registro SP-04189/2026.','Uma vantagem de cinco pontos no segundo turno é politicamente relevante, mas não torna o estado definido. No primeiro turno, os dois estão separados por apenas dois pontos.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml'],
['mg-presidencia','Minas Gerais: Lula 46% e Flávio 45% em segundo turno — empate técnico','Estado tradicionalmente decisivo aparece dividido na nova rodada.','Lula 46% • Flávio 45%','O Datafolha registra 46% para Lula e 45% para Flávio Bolsonaro em eventual segundo turno em Minas Gerais. A diferença de um ponto está dentro da margem de erro.','1.204 entrevistas presenciais entre 8 e 10 de setembro; margem de erro de 3 pontos e confiança de 95%. Registro MG-01611/2026.','Minas volta a ocupar papel de território-chave. Com empate técnico, interiorização da campanha, comparecimento e transferência de votos das chapas estaduais podem ter peso elevado.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml'],
['rj-presidencia','Rio de Janeiro: Flávio chega a 49% e Lula tem 41% no segundo turno','Datafolha aponta vantagem de oito pontos para o candidato do PL.','Flávio 49% • Lula 41%','No Rio de Janeiro, o Datafolha aponta Flávio Bolsonaro com 49% contra 41% de Lula em eventual segundo turno presidencial.','1.204 entrevistas presenciais entre 8 e 10 de setembro; margem de erro de 3 pontos e confiança de 95%. Registro RJ-09217/2026.','O Rio é um dos estados em que Flávio busca construir vantagem para compensar regiões mais favoráveis a Lula. O desempenho das chapas locais também pode alterar a mobilização presidencial.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml'],
['pe-presidencia','Pernambuco: Lula tem 61% e Flávio 30% em eventual segundo turno','É a maior vantagem regional de Lula entre os recortes estaduais destacados nesta rodada.','Lula 61% • Flávio 30%','Em Pernambuco, Lula aparece com 61% e Flávio Bolsonaro com 30% em eventual segundo turno presidencial.','1.204 entrevistas presenciais entre 8 e 10 de setembro; margem de erro de 3 pontos e confiança de 95%. Registro PE-04411/2026.','Pernambuco continua sendo uma âncora eleitoral para Lula. Para Flávio, reduzir a diferença no Nordeste pode ser tão importante quanto ampliar vantagens no Sudeste e Centro-Oeste.','Folha de S.Paulo / Datafolha','https://www1.folha.uol.com.br/poder/2026/09/flavio-lidera-com-47-ante-42-de-lula-em-sp-aponta-datafolha-mg-tem-empate.shtml'],
['evangelicos-btg-nexus','BTG/Nexus: Flávio abre 18 pontos sobre Lula entre eleitores evangélicos','Recorte mostra 45% a 27% no primeiro turno; entre católicos, Lula lidera por 43% a 34%.','Evangélicos: Flávio 45% • Lula 27%','A rodada BTG/Nexus mostra Flávio Bolsonaro com 45% e Lula com 27% entre eleitores evangélicos. Entre católicos, Lula tem 43% e Flávio 34%; entre pessoas sem religião, Lula marca 47% e Flávio 21%.','2.002 entrevistas por telefone de 4 a 7 de setembro; margem de erro geral de 2 pontos, confiança de 95%. Registro BR-06790/2026.','Recortes religiosos ajudam a entender coalizões eleitorais, mas subamostras podem ter incerteza maior que a margem divulgada para a amostra total.','UOL / BTG-Nexus','https://noticias.uol.com.br/eleicoes/2026/09/08/flavio-abre-27-pontos-sobre-lula-entre-evangelicos-diz-pesquisa.ghtm'],
['sp-senado-financas','Senado em SP: Tebet e André do Prado lideram arrecadação; pesquisa segue embolada','Simone Tebet tem R$ 6,6 milhões e André do Prado R$ 6 milhões; Quaest mostra empate técnico no grupo da frente.','Tebet R$ 6,6 mi • Prado R$ 6,0 mi','Dados declarados à Justiça Eleitoral mostram Simone Tebet (PSB) com R$ 6,6 milhões e André do Prado (PL) com R$ 6 milhões. Na Quaest citada pelo UOL, Marina Silva e Guilherme Derrite têm 14% e Tebet 12%, em empate técnico pela margem.','Dados financeiros vêm das prestações à Justiça Eleitoral. A pesquisa Quaest mencionada tem margem de erro de 2 pontos para São Paulo.','Dinheiro aumenta a capacidade de campanha, mas não se converte automaticamente em voto. Estrutura financeira, conhecimento do nome e rejeição precisam ser analisados separadamente.','UOL / Justiça Eleitoral / Quaest','https://noticias.uol.com.br/eleicoes/2026/09/13/simone-tebet-e-andre-do-prado-de-sp-tem-as-campanhas-mais-ricas-ao-senado.ghtm'],
['sc-senado-atlasintel','Santa Catarina: Carol De Toni lidera corrida ao Senado no consolidado, diz AtlasIntel','No total dos dois votos, candidata do PL marca 28,4%, seguida de Esperidião Amin com 20,2%.','De Toni 28,4% • Amin 20,2% • Carlos 14,9%','A AtlasIntel aponta Carol De Toni (PL) com 28,4% no consolidado dos dois votos ao Senado em Santa Catarina. Esperidião Amin (PP) tem 20,2% e Carlos Bolsonaro (PL), 14,9%. No segundo voto, Amin e De Toni aparecem tecnicamente empatados.','1.211 eleitores entre 4 e 9 de setembro, por recrutamento digital aleatório; margem de erro de 3 pontos, confiança de 95%. Registros SC-02036/2026 e BR-06230/2026.','A eleição de duas vagas torna o segundo voto decisivo. O empate técnico no segundo voto mostra como o consolidado pode esconder uma dinâmica diferente entre primeira e segunda escolha.','UOL / AtlasIntel-Grupo ND','https://noticias.uol.com.br/eleicoes/2026/09/11/pesquisa-para-senador-em-santa-catarina-veja-numeros-recentes.ghtm'],
['como-ler-pesquisas','Como ler uma pesquisa eleitoral sem cair em armadilhas','Margem, método, data de campo, amostra e registro no TSE devem ser conferidos antes de comparar números.','Confira: margem • método • datas • registro TSE','Pesquisas eleitorais são retratos do momento, não previsões do resultado das urnas. Para comparar levantamentos, observe datas de campo, tamanho e perfil da amostra, forma de coleta, margem de erro, nível de confiança, contratante e registro na Justiça Eleitoral.','O TSE exige registro prévio das pesquisas eleitorais. Os levantamentos desta edição trazem os números de registro informados pelos institutos e veículos responsáveis.','Quando dois institutos divergem alguns pontos, isso não significa automaticamente que um esteja certo e outro errado. Amostras, questionários e coleta presencial, por telefone ou internet podem produzir retratos diferentes. O melhor é acompanhar séries e convergências.','TSE e metodologias dos institutos','https://www.tse.jus.br/eleicoes/pesquisa-eleitorais']
];function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function img(s,i){let t='VOZ NEWS | '+(i+1)+'/15 | '+s[1]+' | '+s[3];return 'https://placehold.co/1080x1080/061727/d4af37/png?text='+encodeURIComponent(t)}let cards='',arts='';D.forEach((s,i)=>{let u='#'+s[0],im=img(s,i);cards+=`<article class="card"><img src="${im}" alt="Infográfico exclusivo: ${esc(s[1])}"><div><h2>${esc(s[1])}</h2><p>${esc(s[2])}</p><a href="${u}">Ler matéria</a></div></article>`;arts+=`<article class="article" id="${s[0]}"><span class="badge">ELEIÇÕES 2026 • ${i+1}/15</span><h2>${esc(s[1])}</h2><p class="lead">${esc(s[2])}</p><p class="by">Por Paulo Fayad — jornalista e diretor da TV Voz de Brasília</p><img src="${im}" alt="Infográfico exclusivo com os dados da matéria"><p class="note">Imagem editorial própria da VOZ NEWS, produzida a partir dos dados conferidos na fonte indicada abaixo.</p><p>${esc(s[4])}</p><p class="method"><strong>Metodologia e contexto:</strong> ${esc(s[5])}</p><div class="analysis"><strong>Análise de Paulo Fayad — opinião</strong>${esc(s[6])}</div><div class="source"><strong>Fonte/referência:</strong> <a href="${s[8]}" target="_blank" rel="noopener">${esc(s[7])}</a>. A referência é informativa e não implica endosso editorial. Pesquisa é retrato do momento e não previsão do resultado.</div><a class="back" href="#cards">↑ Voltar às 15 pautas</a></article>`});document.getElementById('cards').innerHTML=cards;document.getElementById('articles').innerHTML=arts;</script><script src="/voznews-accessibilidade.js"></script></body></html>
