name: Mobilidade Funcional
on:
  pull_request:
    paths:
      - 'mobilidade/**'
      - 'api/mobilidade-search.js'
      - 'tests/mobilidade-links-test.js'
      - 'tests/mobilidade-search-test.js'
      - '.github/workflows/mobilidade-links.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/mobilidade-links-test.js
      - run: node tests/mobilidade-search-test.js
