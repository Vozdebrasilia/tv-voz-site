name: Link Lunardi
on:
  pull_request:
    paths:
      - 'vercel.json'
      - 'tests/lunardi-shortlink-test.js'
      - '.github/workflows/lunardi-shortlink.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/lunardi-shortlink-test.js
