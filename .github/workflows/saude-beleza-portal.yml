name: Validar VOZ NEWS Saúde & Beleza

on:
  push:
    branches: [feature/saude-beleza, main]
  pull_request:
    branches: [main]

jobs:
  validar-saude-beleza:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar portal Saúde & Beleza
        run: node tests/saude-beleza-portal-test.js
      - name: Validar proteção dos 40 portais
        run: node tests/ecossistema-40-portais-lock-test.js
      - name: Diagnosticar suíte estática do repositório
        shell: bash
        run: |
          failed=0
          for test_file in tests/*-test.js; do
            echo "== $test_file =="
            if ! node "$test_file"; then
              echo "FALHOU: $test_file"
              failed=1
            fi
          done
          exit "$failed"
