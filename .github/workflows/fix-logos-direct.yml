name: One-time first logo update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-logos-direct.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace only first logo card src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '<article class="logo-card"><img alt="Selo 40 anos" loading="lazy" src="https://voz-central-ai.lovable.app/__l5e/assets-v1/92b171bb-b9d6-4d6b-bb14-1b435045a89f/logo-voz-de-brasilia-40anos.png?v=2"/>'
          new = '<article class="logo-card"><img alt="Selo 40 anos" loading="lazy" src="https://voz-central-ai.lovable.app/__l5e/assets-v1/0647affc-2a0a-41b9-a99c-62b7694c2c8f/logo-voz-de-brasilia-40anos-oficial.png"/>'
          if html.count(old) != 1:
              raise SystemExit(f'Esperava exatamente 1 primeiro card; encontrei {html.count(old)}')
          p.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit only index.html
        run: |
          git config user.name "Vozdebrasilia"
          git config user.email "paulofayad@gmail.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: usar logo oficial de 40 anos no primeiro card"
          git push origin main
