name: Fix logos direct

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-logos-direct.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply direct logo fix
        run: python3 .github/scripts/fix-logos.py

      - name: Commit changes
        run: |
          git config user.name "Vozdebrasilia"
          git config user.email "paulofayad@gmail.com"
          git add index.html voznews-accessibilidade.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: substituir logos diretamente no index em alta resolução"
          git push origin main

# rerun
