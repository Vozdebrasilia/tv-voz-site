name: Proteção do Portal Nota 10 VOZ NEWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proteger-top10:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar estrutura TOP 10
        run: |
          node tests/top10-existing-sites-routing-test.js
          node tests/top10-existing-portals-contract-test.js
          node tests/top10-new-portals-contract-test.js
