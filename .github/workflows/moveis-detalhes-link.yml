name: Ativar detalhes Moveis Decoracao

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moveis-detalhes-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inserir script de detalhes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('moveis-decoracao/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="../voznews-accessibilidade.js" defer></script>'
          tag = '<script src="./detalhes.js" defer></script>'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('marcador de acessibilidade nao encontrado')
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar alteracao
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Voz News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add moveis-decoracao/index.html
          git commit -m "feat: ativar detalhes clicaveis em moveis e decoracao"
          git push origin main
