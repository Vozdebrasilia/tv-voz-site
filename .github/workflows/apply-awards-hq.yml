name: Apply awards HQ
on:
  push:
    paths:
      - 'awards-hq.tar.gz.b64'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply high-resolution awards
        run: |
          base64 -d awards-hq.tar.gz.b64 > /tmp/awards-hq.tar.gz
          tar -xzf /tmp/awards-hq.tar.gz
          rm -f awards-hq.tar.gz.b64
          git config user.name "Voz News Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/awards/card-*.jpg awards-hq.tar.gz.b64
          git commit -m "fix: usar logos de premios em alta qualidade"
          git push
