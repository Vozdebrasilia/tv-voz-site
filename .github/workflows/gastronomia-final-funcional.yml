name: Gastronomia Final Funcional

on:
  pull_request:
    paths:
      - "gastronomia/**"
      - "tests/gastronomia-final-funcional-test.js"
      - ".github/workflows/gastronomia-final-funcional.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar links, matérias e Cerrado
        run: node tests/gastronomia-final-funcional-test.js
