<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio VOZ NEWS</title>
<style>
html,body{margin:0;background:#061423;min-height:100%;display:grid;place-items:center}img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
</style>
</head>
<body>
<img id="studio" alt="Studio VOZ NEWS">
<script>
(async()=>{
  const files=['part0.txt','part1.txt','part2.txt','part3.txt','part4.txt'];
  const parts=await Promise.all(files.map(f=>fetch('/assets/studio-v35/'+f,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error('Falha ao carregar '+f);return r.text()})));
  document.getElementById('studio').src='data:image/jpeg;base64,'+parts.join('').replace(/\s+/g,'');
})().catch(err=>{document.body.innerHTML='<p style="color:white;font-family:Arial;padding:24px">'+err.message+'</p>'});
</script>
</body>
</html>
