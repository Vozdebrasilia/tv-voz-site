 seguro e valor de revenda entram na conta de quem avalia um elétrico.'],locadoras:['Locadoras e Frotas','SERVIÇOS • TURISMO • EMPRESAS','Locação de veículos, terceirização de frotas, assinatura e mobilidade corporativa mudaram a forma de acessar um automóvel.','https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1600&q=85','Frotas modernas','Empresas buscam previsibilidade, manutenção, disponibilidade e eficiência operacional.','Turismo e aeroportos','A locação continua essencial para quem precisa de liberdade de deslocamento em viagens.','Assinatura','Modelos de assinatura transformam o automóvel em serviço recorrente.'],concessionarias:['Concessionárias','VAREJO • SERVIÇO • EXPERIÊNCIA','O ponto de venda deixa de ser apenas showroom e se transforma em centro de experiência, pós-venda e relacionamento.','https://images.unsplash.com/photo-1562141961-b5d1be7b0a25?auto=format&fit=crop&w=1600&q=85','Varejo automotivo','Atendimento, estoque, test-drive e negociação precisam conversar com a jornada digital do cliente.','Pós-venda','Oficina, peças, revisão e relacionamento influenciam fortemente a recompra.','Experiência','O consumidor compara produto, atendimento e reputação antes de fechar negócio.'],nautica:['Náutica','ÁGUA • MARINAS • TURISMO','Barcos, lanchas, marinas, pesca, turismo e lazer formam um mercado visual e de alta experiência.','https://images.unsplash.com/photo-1567899378494-47b22a2ae96a?auto=format&fit=crop&w=1600&q=85','Mercado náutico','Embarcações, manutenção, seguros e serviços especializados movimentam uma cadeia ampla.','Tecnologia a bordo','Navegação, segurança, motores e conectividade evoluem rapidamente.','Turismo sobre a água','Destinos, marinas e experiências exclusivas criam novas oportunidades de conteúdo e negócios.'],aviacao:['Aviação','AR • COMPANHIAS • DESTINOS','A aviação conecta negócios, turismo, logística e infraestrutura e continua sendo um dos setores mais estratégicos da mobilidade.','https://imag
