<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matéria • VOZ NEWS Mobilidade</title><meta name="robots" content="index,follow,max-image-preview:large"><link rel="icon" href="../favicon-voznews.png">
<style>
:root{--navy:#0d3152;--blue:#1d6fa5;--red:#d9291c;--ink:#183047;--muted:#607488;--line:#dfe7ee;--bg:#f5f8fb;--shadow:0 18px 45px rgba(41,69,94,.14)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}img{display:block;max-width:100%}.wrap{width:min(1120px,92%);margin:auto}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}.header-in{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:18px}.header img{width:225px}.back{font-weight:900;color:var(--red);font-size:13px}.article{padding:58px 0}.kicker{display:inline-block;color:var(--red);font-size:12px;font-weight:900;letter-spacing:1px}.article h1{font-size:clamp(42px,6vw,72px);line-height:1;letter-spacing:-2px;color:var(--navy);max-width:1000px;margin:14px 0}.deck{font-size:21px;line-height:1.5;color:#4c6275;max-width:900px}.meta{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0 28px;font-size:12px;font-weight:800;color:#708396}.hero{width:100%;height:520px;object-fit:cover;border-radius:28px;box-shadow:var(--shadow)}.content{display:grid;grid-template-columns:minmax(0,760px) 1fr;gap:34px;margin-top:38px}.body p{font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:1.72;color:#263c50;margin:0 0 24px}.source{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);color:#5b7183;font-size:13px;line-height:1.5}.source a{color:var(--blue);font-weight:900}.side{display:flex;flex-direction:column;gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}.metric strong{display:block;color:var(--red);font-size:30px}.metric span{font-size:12px;color:#687c8e}.related{padding:56px 0;background:#fff;border-top:1px solid var(--line)}.related h2{font-size:36px;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(45,74,99,.08)}.card img{width:100%;height:170px;object-fit:cover}.card div{padding:17px}.card small{color:var(--red);font-weight:900}.card h3{font-size:20px;color:var(--navy);margin:7px 0}.footer{padding:38px 0;text-align:center;background:#fff;border-top:1px solid var(--line)}.footer img{width:190px;margin:auto}.footer p{font-size:12px;color:#718497}.notfound{padding:80px 0;text-align:center}.notfound h1{color:var(--navy)}@media(max-width:850px){.content{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{height:320px}}@media(max-width:520px){.side{grid-template-columns:1fr}.article h1{letter-spacing:-1px}.header img{width:185px}.back{font-size:11px}}
</style>
<script src="/mobilidade/conteudo.js"></script>
</head>
<body>
<header class="header"><div class="wrap header-in"><a href="/mobilidade/"><img src="../logo-voznews-oficial.png" alt="VOZ NEWS"></a><a class="back" id="back" href="/mobilidade/">← VOLTAR À EDITORIA</a></div></header>
<main id="page"><article class="article"><div class="wrap"><span class="kicker" id="kicker"></span><h1 id="title"></h1><p class="deck" id="deck"></p><div class="meta"><span id="date"></span><span>VOZ NEWS MOBILIDADE</span></div><img class="hero" id="hero" alt=""><div class="content"><div class="body" id="body"></div><aside class="side"><div class="metric"><strong>240K+</strong><span>seguidores no Instagram</span></div><div class="metric"><strong>200M+</strong><span>interações mensais</span></div><div class="metric"><strong>40 anos</strong><span>de credibilidade</span></div><div class="source" id="source"></div></aside></div></div></article></main>
<section class="related" id="related-section"><div class="wrap"><h2>Leia também</h2><div class="grid" id="related"></div></div></section>
<footer class="footer"><img src="../logo-voznews-oficial.png" alt="VOZ NEWS"><p>VOZ NEWS MOBILIDADE • Informação para quem decide, viaja, compra e investe.</p></footer>
<script>
(function(){
 const store=window.VOZ_MOBILIDADE||{themes:{},articles:{}};const id=new URLSearchParams(location.search).get('id')||'';const a=store.articles[id];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 if(!a){document.getElementById('page').innerHTML='<div class="wrap notfound"><h1>Matéria não encontrada</h1><p>O conteúdo pode ter sido atualizado.</p><p><a class="back" href="/mobilidade/">Voltar ao VOZ NEWS Mobilidade</a></p></div>';document.getElementById('related-section').style.display='none';return}
 document.title=a.title+' • VOZ NEWS Mobilidade';document.getElementById('kicker').textContent=a.kicker;document.getElementById('title').textContent=a.title;document.getElementById('deck').textContent=a.summary;document.getElementById('date').textContent=a.date||'VOZ NEWS • 2026';document.getElementById('hero').src=a.image;document.getElementById('hero').alt=a.title;document.getElementById('back').href='/mobilidade/tema.html?tema='+encodeURIComponent(a.theme);document.getElementById('body').innerHTML=(a.body||[]).map(p=>'<p>'+esc(p)+'</p>').join('');
 document.getElementById('source').innerHTML=a.source?('Fonte de referência: '+(a.sourceUrl?'<a href="'+esc(a.sourceUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(a.source)+'</a>':esc(a.source))+'. O texto acima é uma síntese editorial do VOZ NEWS.'):'Conteúdo editorial VOZ NEWS Mobilidade.';
 const theme=store.themes[a.theme];const related=(theme&&theme.articles||[]).filter(x=>x!==id).slice(0,3).map(x=>store.articles[x]).filter(Boolean);document.getElementById('related').innerHTML=related.map(r=>'<a class="card" href="/mobilidade/materia.html?id='+encodeURIComponent(r.id)+'"><img src="'+esc(r.image)+'" alt="'+esc(r.title)+'"><div><small>'+esc(r.kicker)+'</small><h3>'+esc(r.title)+'</h3></div></a>').join('');if(!related.length)document.getElementById('related-section').style.display='none';
})();
</script>
</body></html>
